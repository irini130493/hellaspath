<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HellasPath Private Intake &amp; Consultation</title>
  <style>
    :root {
      --bg: #0f141c;
      --surface: #171f2b;
      --surface-alt: #1e2838;
      --text: #f4f1ea;
      --muted: #b6bfd0;
      --gold: #d4af6a;
      --gold-hover: #e3c282;
      --border: rgba(212, 175, 106, 0.24);
      --accent-soft: rgba(212, 175, 106, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #0c1017 0%, var(--bg) 45%, #121822 100%);
      color: var(--text);
      line-height: 1.55;
      padding: 20px 14px 48px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    .hero {
      background: linear-gradient(145deg, rgba(28, 38, 53, 0.96), rgba(18, 25, 36, 0.98));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      margin-bottom: 18px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 5vw, 34px);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
    }

      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
      color: var(--text);
    }
